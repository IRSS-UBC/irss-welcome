<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to new site...</title>

  <link id="canonical-link" rel="canonical" href="https://irss-docs.pages.dev/"/>
  <meta http-equiv="refresh" content="0; url=https://irss-docs.pages.dev/">

  <!-- Main redirect script -->
  <script type="text/javascript">
    var newDomain = "https://irss-docs.pages.dev";
    var repoNameToRemove = "/irss-welcome"; 

    var currentPath = window.location.pathname;
    var pathAfterRepo = currentPath.startsWith(repoNameToRemove)
      ? currentPath.substring(repoNameToRemove.length)
      : currentPath;

    var newUrl = newDomain + pathAfterRepo + window.location.search + window.location.hash;

    var canonicalLink = document.getElementById('canonical-link');
    if (canonicalLink) {
      canonicalLink.href = newUrl;
    }

    window.location.replace(newUrl);
  </script>
</head>
<body>
  <h1>This site has moved to a new address.</h1>
  <p>You are being automatically redirected.</p>
  <p>
    If the redirect does not work, please
    <a id="redirect-link" href="https://irss-docs.pages.dev/">click here to go to the new site</a>.
  </p>

  <script type="text/javascript">
    var fallbackLink = document.getElementById('redirect-link');
    if (fallbackLink) {
      // Re-run the same logic to construct the new URL for the link's href.
      var newDomain = "https://irss-docs.pages.dev";
      var repoNameToRemove = "/irss-welcome";
      var currentPath = window.location.pathname;
      var pathAfterRepo = currentPath.startsWith(repoNameToRemove)
        ? currentPath.substring(repoNameToRemove.length)
        : currentPath;
      var newUrl = newDomain + pathAfterRepo + window.location.search + window.location.hash;
      fallbackLink.href = newUrl;
    }
  </script>
</body>
</html>
