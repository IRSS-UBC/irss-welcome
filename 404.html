<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    const newDomain = "https://irss-docs.pages.dev";
    const repoNameToRemove = "/irss-welcome";

    // --- Logic ---
    // Get the full path of the URL the user tried to access.
    const currentPath = window.location.pathname;

    // Determine the path to append to the new domain.
    // If the path starts with the repo name, strip it out. Otherwise, use the path as is.
    const relativePath = currentPath.startsWith(repoNameToRemove)
      ? currentPath.substring(repoNameToRemove.length)
      : currentPath;

    // Reconstruct the full new URL, preserving any search parameters (?foo=bar) and hash (#section).
    const newUrl = newDomain + relativePath + window.location.search + window.location.hash;

    // Perform the redirect.
    // window.location.replace() is used to avoid adding the old URL to the browser's history.
    window.location.replace(newUrl);
  </script>
</head>
<body>
  <!-- This content is a fallback for users with JavaScript disabled or for crawlers. -->
  <h1>This page has moved.</h1>
  <p>You are being redirected to the new site.</p>
  <p>If you are not automatically redirected, please click this link: <a href="https://irss-docs.pages.dev">https://irss-docs.pages.dev</a></p>
</body>
</html>
